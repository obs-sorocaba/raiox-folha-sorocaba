<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Lupa com folha — identidade OSB">
  <defs>
    <linearGradient id="vidro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaffd0"/>
      <stop offset="1" stop-color="#7ab648"/>
    </linearGradient>
  </defs>

  <!-- cabo da lupa -->
  <rect x="126" y="126" width="56" height="22" rx="11"
        transform="rotate(45 126 126)" fill="#1d4023"/>

  <!-- aro -->
  <circle cx="82" cy="82" r="58" fill="none" stroke="#1d4023" stroke-width="12"/>

  <!-- vidro -->
  <circle cx="82" cy="82" r="50" fill="url(#vidro)" opacity="0.92"/>

  <!-- folha dentro do vidro -->
  <path d="M82 44 C58 58 56 92 82 116 C108 92 106 58 82 44 Z" fill="#2f5e27"/>
  <path d="M82 50 L82 110" stroke="#eaffd0" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M82 68 L66 60 M82 80 L64 74 M82 92 L68 88 M82 68 L98 60 M82 80 L100 74 M82 92 L96 88"
        stroke="#eaffd0" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- brilho do vidro -->
  <ellipse cx="64" cy="62" rx="14" ry="9" fill="#ffffff" opacity="0.35"
           transform="rotate(-35 64 62)"/>
</svg>